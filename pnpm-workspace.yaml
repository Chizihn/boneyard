packages:
  - "packages/*"
  - "apps/*"
  - "backend/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@nestjs/core': true
  '@swc/core': true
  esbuild: true
  prisma: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - expo-router@58.0.32
  - expo-web-browser@58.1.0
  - '@expo/cli@58.1.21'
  - '@expo/metro-config@58.0.23'
  - '@expo/router-server@58.0.23'
  - babel-preset-expo@58.0.26
  - expo-file-system@58.0.14
  - expo@58.0.26
